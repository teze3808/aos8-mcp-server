<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">AOS8 MCP Server Request Flow</title>
  <desc id="desc">Animated diagram showing an operator request moving through an MCP-capable AI client, aos8-mcp-server, ArubaOS 8 REST API, and an AOS8 controller.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf7f3"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" x2="1">
      <stop offset="0%" stop-color="#dff7ef"/>
      <stop offset="100%" stop-color="#c9eee4"/>
    </linearGradient>
    <linearGradient id="aos" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#dbe6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d2939" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#496579"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0b7f5f"/>
    </marker>
    <style>
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .connector {
        fill: none;
        stroke: #496579;
        stroke-width: 3;
        stroke-linecap: round;
        marker-end: url(#arrowSlate);
        opacity: .35;
        animation: pulse 4.8s infinite;
      }
      .connector.c2 { animation-delay: .6s; }
      .connector.c3 { animation-delay: 1.2s; }
      .connector.c4 { animation-delay: 1.8s; }
      .returnConnector {
        fill: none;
        stroke: #0b7f5f;
        stroke-width: 2.5;
        stroke-linecap: round;
        marker-end: url(#arrowGreen);
        opacity: .28;
        animation: returnPulse 4.8s infinite;
      }
      .returnConnector.r1 { animation-delay: 3.6s; }
      .returnConnector.r2 { animation-delay: 3.0s; }
      .returnConnector.r3 { animation-delay: 2.4s; }
      .returnConnector.r4 { animation-delay: 1.8s; }
      .safePulse {
        animation: safePulse 1.8s infinite;
        transform-origin: center;
      }
      @keyframes pulse {
        0%, 18%, 100% { opacity: .35; stroke-width: 3; }
        8% { opacity: 1; stroke-width: 5; }
      }
      @keyframes returnPulse {
        0%, 18%, 100% { opacity: .28; stroke-width: 2.5; }
        8% { opacity: .95; stroke-width: 4; }
      }
      @keyframes safePulse {
        0%, 100% { opacity: .45; r: 6; }
        50% { opacity: 1; r: 8; }
      }
    </style>
  </defs>

  <rect width="980" height="300" rx="18" fill="url(#bg)"/>
  <text x="490" y="38" text-anchor="middle" class="label" font-size="22" font-weight="700" fill="#102a24">AOS8 MCP Request Flow</text>
  <text x="490" y="63" text-anchor="middle" class="label" font-size="13" fill="#496579">Natural language in, safe AOS8 API reads and plan-only workflows out</text>

  <g filter="url(#shadow)">
    <rect x="40" y="110" width="150" height="82" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="240" y="110" width="150" height="82" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="440" y="110" width="150" height="82" rx="12" fill="url(#mcp)" stroke="#0b7f5f"/>
    <rect x="640" y="110" width="150" height="82" rx="12" fill="url(#aos)" stroke="#3563c9"/>
    <rect x="840" y="110" width="100" height="82" rx="12" fill="url(#aos)" stroke="#3563c9"/>
  </g>

  <path class="connector c1" d="M190 151 H238"/>
  <path class="connector c2" d="M390 151 H438"/>
  <path class="connector c3" d="M590 151 H638"/>
  <path class="connector c4" d="M790 151 H838"/>
  <path class="returnConnector r1" d="M238 203 H190"/>
  <path class="returnConnector r2" d="M438 203 H390"/>
  <path class="returnConnector r3" d="M638 203 H590"/>
  <path class="returnConnector r4" d="M838 203 H790"/>

  <text x="115" y="142" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">Operator</text>
  <text x="115" y="163" text-anchor="middle" class="label" font-size="12" fill="#496579">asks a question</text>

  <text x="315" y="142" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">AI Client</text>
  <text x="315" y="163" text-anchor="middle" class="label" font-size="12" fill="#496579">selects tools</text>

  <text x="515" y="137" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102a24">aos8-mcp-server</text>
  <text x="515" y="159" text-anchor="middle" class="label" font-size="12" fill="#226a58">tools + prompts</text>
  <text x="515" y="177" text-anchor="middle" class="label" font-size="11" fill="#226a58">read-only / plan-only</text>

  <text x="715" y="142" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">AOS8 REST API</text>
  <text x="715" y="163" text-anchor="middle" class="label" font-size="12" fill="#3563c9">GET / showcommand</text>

  <text x="890" y="137" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#102040">AOS8</text>
  <text x="890" y="158" text-anchor="middle" class="label" font-size="12" fill="#3563c9">controller</text>
  <text x="890" y="176" text-anchor="middle" class="label" font-size="11" fill="#3563c9">live data</text>

  <g>
    <rect x="352" y="232" width="276" height="38" rx="19" fill="#ffffff" stroke="#c7d3df"/>
    <circle class="safePulse" cx="378" cy="251" r="6" fill="#0b7f5f"/>
    <text x="402" y="256" class="label" font-size="12" fill="#496579">secrets redacted, config writes blocked</text>
  </g>
</svg>
