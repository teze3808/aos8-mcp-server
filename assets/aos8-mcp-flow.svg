<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">AOS8 MCP Server Request Flow</title>
  <desc id="desc">Animated diagram showing an operator request flowing through an MCP client, aos8-mcp-server, ArubaOS 8 REST API, and an AOS8 controller, then returning a summarized answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf7f3"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" x2="1">
      <stop offset="0%" stop-color="#dff7ef"/>
      <stop offset="100%" stop-color="#c9eee4"/>
    </linearGradient>
    <linearGradient id="aos" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#dbe6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d2939" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#496579"/>
    </marker>
  </defs>

  <rect width="980" height="300" rx="18" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#102a24">AOS8 MCP Request Flow</text>
  <text x="490" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#496579">Natural language in, safe AOS8 API reads and plan-only workflows out</text>

  <g filter="url(#shadow)">
    <rect x="40" y="105" width="150" height="82" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="240" y="105" width="150" height="82" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="440" y="105" width="150" height="82" rx="12" fill="url(#mcp)" stroke="#0b7f5f"/>
    <rect x="640" y="105" width="150" height="82" rx="12" fill="url(#aos)" stroke="#3563c9"/>
    <rect x="840" y="105" width="100" height="82" rx="12" fill="url(#aos)" stroke="#3563c9"/>
  </g>

  <text x="115" y="137" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#102040">Operator</text>
  <text x="115" y="158" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#496579">asks a question</text>

  <text x="315" y="137" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#102040">AI Client</text>
  <text x="315" y="158" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#496579">selects tools</text>

  <text x="515" y="132" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#102a24">aos8-mcp-server</text>
  <text x="515" y="154" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#226a58">tools + prompts</text>
  <text x="515" y="172" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#226a58">read-only / plan-only</text>

  <text x="715" y="137" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#102040">AOS8 REST API</text>
  <text x="715" y="158" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#3563c9">GET / showcommand</text>

  <text x="890" y="132" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#102040">AOS8</text>
  <text x="890" y="153" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#3563c9">controller</text>
  <text x="890" y="171" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#3563c9">live data</text>

  <path id="forwardPath" d="M190 146 H240 M390 146 H440 M590 146 H640 M790 146 H840" fill="none" stroke="#496579" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path id="returnPath" d="M840 208 H790 M640 208 H590 M440 208 H390 M240 208 H190" fill="none" stroke="#0b7f5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <circle r="7" fill="#0b7f5f">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M190 146 H240 M390 146 H440 M590 146 H640 M790 146 H840"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#3563c9">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M840 208 H790 M640 208 H590 M440 208 H390 M240 208 H190"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <g>
    <rect x="375" y="232" width="230" height="38" rx="19" fill="#ffffff" stroke="#c7d3df"/>
    <circle cx="398" cy="251" r="6" fill="#0b7f5f">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="418" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#496579">secrets redacted, writes blocked</text>
  </g>
</svg>
