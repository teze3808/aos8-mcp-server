[project]
name = "aos8-mcp-server"
version = "0.3.0"
description = "Read-only, node-aware MCP server for Aruba AOS8 operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vincent" }
]
license = "MIT"
keywords = ["aruba", "aos8", "mcp", "network-automation", "wireless"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.28.1,<2",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.14.2",
]

[project.scripts]
aos8-mcp-server = "aruba_aos8_mcp.server:main"

[project.urls]
Homepage = "https://github.com/teze3808/aos8-mcp-server"
Repository = "https://github.com/teze3808/aos8-mcp-server"
Issues = "https://github.com/teze3808/aos8-mcp-server/issues"

[dependency-groups]
dev = [
  "pip-audit>=2.10.1",
  "pypdf>=6.14.2",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aruba_aos8_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
