[project]
name = "aos8-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Aruba AOS8 monitoring."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vincent" }
]
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
]

[project.scripts]
aos8-mcp-server = "aruba_aos8_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aruba_aos8_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
